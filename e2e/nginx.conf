upstream scatola {
  server scatola:3000;
  server scatola2:3000;
}

server {
  listen 80;
  client_max_body_size 0;

  location / {
    proxy_pass http://scatola;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_buffering off;
    # A stopped instance must be skipped fast: office servers give up on saves after ~30 s.
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;
  }
}
